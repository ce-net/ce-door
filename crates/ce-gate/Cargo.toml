[package]
name = "ce-gate"
version = "0.1.0"
edition = "2021"
description = "ce-wire Hello proof (D11a): the client signs its Hello with its CE node key and presents a ce-cap chain; the cell verifies both with ce-cap and grants the API rights the chain covers"

[features]
door = ["ce-wire/server", "dep:tokio"]

[[bin]]
name = "ce-door"
required-features = ["door"]

[dependencies]
ce-wire = { path = "../ce-wire", default-features = false, features = ["blocking"] }
tokio = { version = "1", optional = true, features = ["rt", "net", "io-util", "time"] }
ce-cap = { git = "https://github.com/ce-net/ce-cap", rev = "560d348fe1311ec5ff3e7a1199d715e1fea507f4" }
ce-identity = { git = "https://github.com/ce-net/ce-cap", rev = "560d348fe1311ec5ff3e7a1199d715e1fea507f4" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde_json = "1"
getrandom = "0.2"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
ce-wire = { path = "../ce-wire", features = ["blocking"] }
